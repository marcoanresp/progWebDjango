{% extends "base.html" %}

{% block titulo %}Cadastro - EduMarket{% endblock %}

{% block conteudo %}
    <div class="row justify-content-center">
        <div class="col-md-6">
            <div class="card shadow-sm">
                <div class="card-body p-4">
                    <h3 class="mb-3 text-center">Criar conta</h3>
                    <form method="post">
                        {% csrf_token %}
                        <div class="mb-3">
                            <label class="form-label d-block">Quero me cadastrar como</label>
                            {% for valor, nome in tipos %}
                                <div class="form-check form-check-inline">
                                    <input class="form-check-input" type="radio" name="tipo" id="tipo{{ valor }}" value="{{ valor }}" {% if forloop.first %}checked{% endif %}>
                                    <label class="form-check-label" for="tipo{{ valor }}">{{ nome }}</label>
                                </div>
                            {% endfor %}
                            <div class="form-text">Vendedores podem criar e vender cursos; clientes compram e assistem.</div>
                        </div>
                        <div class="mb-3">
                            <label for="nome" class="form-label">Nome completo</label>
                            <input type="text" class="form-control" id="nome" name="nome">
                        </div>
                        <div class="mb-3">
                            <label for="usuario" class="form-label">Usuário</label>
                            <input type="text" class="form-control" id="usuario" name="usuario" required>
                        </div>
                        <div class="mb-3">
                            <label for="email" class="form-label">E-mail</label>
                            <input type="email" class="form-control" id="email" name="email" required>
                        </div>
                        <div class="row">
                            <div class="col-sm-6 mb-3">
                                <label for="senha" class="form-label">Senha</label>
                                <input type="password" class="form-control" id="senha" name="senha" required>
                            </div>
                            <div class="col-sm-6 mb-3">
                                <label for="confirmacao" class="form-label">Confirme a senha</label>
                                <input type="password" class="form-control" id="confirmacao" name="confirmacao" required>
                            </div>
                        </div>
                        <button type="submit" class="btn btn-primary w-100">Cadastrar</button>
                    </form>
                    <p class="text-center mt-3 mb-0">Já tem conta? <a href="{% url 'login' %}">Entrar</a></p>
                </div>
            </div>
        </div>
    </div>
{% endblock %}
