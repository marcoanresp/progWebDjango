{% extends "base.html" %}

{% block titulo %}Entrar - EduMarket{% endblock %}

{% block conteudo %}
    <div class="tela-auth mx-auto py-md-4">
        <div class="text-center mb-4">
            <span class="icone-circulo mb-3"><i class="fas fa-sign-in-alt"></i></span>
            <h1 class="h3 fw-bold">Bem-vindo de volta</h1>
            <p class="text-body-secondary">Entre para acessar seus cursos.</p>
        </div>
        <div class="card border-0 shadow-sm">
            <div class="card-body p-4">
                <form method="post">
                    {% csrf_token %}
                    <div class="form-floating mb-3">
                        <input type="text" class="form-control" id="usuario" name="usuario" placeholder="Usuário" value="{{ usuario|default:'' }}" required autofocus autocomplete="username">
                        <label for="usuario"><i class="fas fa-user me-1"></i> Usuário</label>
                    </div>
                    <div class="form-floating mb-3">
                        <input type="password" class="form-control" id="senha" name="senha" placeholder="Senha" required autocomplete="current-password">
                        <label for="senha"><i class="fas fa-lock me-1"></i> Senha</label>
                    </div>
                    <button type="submit" class="btn btn-primary btn-lg w-100">Entrar</button>
                </form>
            </div>
        </div>
        <p class="text-center mt-3">Ainda não tem conta? <a href="{% url 'cadastro' %}" class="fw-semibold">Cadastre-se</a></p>
    </div>
{% endblock %}
